FLOODING.DNSCOUNT.FIELD=FLOODING-DNSCOUNT-FIELD
FLOODING.DNSLOADFAIL.FIELD=FLOODING-DNSLOADFAIL-FIELD

FLOODING.FTPCOUNT.FIELD=FLOODING-FTPCOUNT-FIELD
